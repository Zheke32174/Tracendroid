name: app-build

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/operit-fork-optimization-WWapH"
    paths-ignore:
      - "debian/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/rootfs.yml"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

# Skip the heavy build when the only changes are docs or the rootfs pipeline.
# The pattern matches the threat-model commits ("docs:" prefix) and any
# debian/ pipeline-only changes — those land outside the app source.

jobs:
  compile:
    name: Compile + lint (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # setup-gradle@v4 validates EVERY gradle-wrapper.jar in the tree by default,
      # including ones vendored deep inside third-party submodules. Once the
      # bullet3 .gitmodules fix let the full submodule tree check out, that pulled
      # in one wrapper the action doesn't recognise:
      #   mnn/.../MNN/3rd_party/flatbuffers/samples/android/gradle/wrapper/gradle-wrapper.jar
      # It's an upstream Flatbuffers sample on an old Gradle version — not a wrapper
      # this repo ever builds with, and every other wrapper (including our own root
      # one) is a recognised official checksum. So we run the standalone validator
      # with that single known-provenance checksum allowlisted, and disable the
      # duplicate auto-validation in setup-gradle below. Our real wrapper is still
      # validated — tampering it would still fail this step.
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04

      # JDK 21, not 17: a transitive dependency (com.kyant:backdrop:1.0.6) ships
      # class files at bytecode version 65 (Java 21), which a JDK-17 javac can't
      # read ("class file has wrong version 65.0, should be 61.0") — it fails
      # kaptDebugKotlin. The app still targets Java 17 output (sourceCompatibility
      # / jvmTarget = 17 in app/build.gradle.kts); a JDK-21 toolchain reads the
      # newer dependency and still emits Java-17 bytecode. AGP + Gradle 8.13 both
      # support running on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Wrapper validation is handled by the dedicated step above (with the
          # vendored-sample allowlist); don't run it a second time here.
          validate-wrappers: false
          # Cache the Gradle home + the wrapper across runs of the same branch.
          # Kotlin compilation is the heaviest single phase; warm caches drop
          # this job from ~20 minutes to ~6.
          cache-read-only: false

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      # compileDebugKotlin proves the codebase parses + types — that's the
      # minimum we need to know the threat-model changes didn't break the
      # build. Full assembleDebug runs lint + dexing which roughly doubles
      # the runtime; switch to it when the team is OK paying that cost.
      - name: Compile (debug Kotlin)
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace || true
        # Lint findings don't fail the job in v1 — the project has decades
        # of pre-existing warnings the threat-model work didn't introduce.
        # Switch this to a real failure once the warnings are triaged.

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
