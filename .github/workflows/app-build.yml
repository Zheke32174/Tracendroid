name: app-build

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/operit-fork-optimization-WWapH"
    paths-ignore:
      - "debian/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/rootfs.yml"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

# Skip the heavy build when the only changes are docs or the rootfs pipeline.
# The pattern matches the threat-model commits ("docs:" prefix) and any
# debian/ pipeline-only changes — those land outside the app source.

jobs:
  compile:
    name: Compile + lint (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Verify the ONE wrapper JAR this job actually executes.
      #
      # setup-gradle's built-in validate-wrappers scans the whole worktree, and
      # with submodules checked out that includes ten vendored wrapper JARs from
      # MNN, sherpa-ncnn, llama.cpp and friends. One of them --
      # mnn/src/main/cpp/MNN/3rd_party/flatbuffers/samples/android/ -- has a
      # checksum that matches no published Gradle release, so the whole job fails
      # before it builds anything.
      #
      # The two easy answers are both wrong. Turning validation off drops a real
      # supply-chain check, and allow-listing that checksum waves through a
      # binary nobody has verified.
      #
      # So: validation is pinned to ./gradlew, which is the only wrapper this job
      # runs. Any change to it fails the job. The vendored sample wrappers are
      # not executed here and are not vouched for -- see WRAPPER-AUDIT note in
      # the PR. That is a narrower claim than the default scan makes, and unlike
      # the default scan it is one this repo can actually honour.
      - name: Verify the Gradle wrapper we execute
        run: |
          set -euo pipefail
          expected=e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar changed"
            echo "  expected $expected"
            echo "  actual   $actual"
            echo "If this change is intentional, update the pin in this workflow."
            exit 1
          fi
          echo "wrapper verified: $actual"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache the Gradle home + the wrapper across runs of the same branch.
          # Kotlin compilation is the heaviest single phase; warm caches drop
          # this job from ~20 minutes to ~6.
          cache-read-only: false
          # Replaced by the pinned check above; see that step for why.
          validate-wrappers: false

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      # compileDebugKotlin proves the codebase parses + types — that's the
      # minimum we need to know the threat-model changes didn't break the
      # build. Full assembleDebug runs lint + dexing which roughly doubles
      # the runtime; switch to it when the team is OK paying that cost.
      # -PffmpegKitFallback resolves ffmpeg-kit from Maven instead of the
      # vendored app/libs AAR. CI is exactly the case that flag exists for:
      # app/libs is gitignored, so a clean checkout has no AAR and the
      # ffmpeg call sites cannot compile without it. A developer machine with
      # the vendored AAR present should NOT set this — see the dependencies
      # block in app/build.gradle.kts for why it is opt-in.
      - name: Compile (debug Kotlin)
        run: ./gradlew :app:compileDebugKotlin -PffmpegKitFallback=true --no-daemon --stacktrace

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace || true
        # Lint findings don't fail the job in v1 — the project has decades
        # of pre-existing warnings the threat-model work didn't introduce.
        # Switch this to a real failure once the warnings are triaged.

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
