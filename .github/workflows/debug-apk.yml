name: debug-apk
# Proof workflow: build an unsigned debug APK (native modules from source).
# Hollow build — FFmpeg stubbed, no vendored model/pet/jniLib blobs — just proves
# the pipeline compiles -> native-builds -> assembles -> emits an installable APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: assembleDebug (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK + CMake + platform
        run: |
          yes | sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-36" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracendroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
