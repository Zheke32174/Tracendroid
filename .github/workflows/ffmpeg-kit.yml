name: ffmpeg-kit-build
on:
  workflow_dispatch:
  push:
    branches: ["tracendroid/ffmpeg-kit-ci"]
permissions:
  contents: read
jobs:
  build:
    name: ffmpeg-kit android arm64 (via repo script)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout fork (for build_ffmpeg_kit_wsl.sh)
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config cmake ninja-build meson nasm yasm \
            gettext autopoint gperf autogen bison flex texinfo git curl \
            build-essential ragel groff gtk-doc-tools
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Set up Android SDK + NDK 22
        uses: android-actions/setup-android@v3
      - name: Install NDK r22 + cmake
        run: yes | sdkmanager --install "ndk;22.1.7171670" "cmake;3.22.1" "platforms;android-33" "build-tools;34.0.0" >/dev/null
      - name: Clone ffmpeg-kit (with submodules)
        run: git clone --recurse-submodules --depth 1 --shallow-submodules --branch v6.0 https://github.com/arthenica/ffmpeg-kit.git "$HOME/build/ffmpeg-kit"
      - name: Run the fork's build script (proxy stripped)
        env:
          ANDROID_SDK_ROOT_OVERRIDE: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME_OVERRIDE: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT_OVERRIDE: ${{ env.ANDROID_SDK_ROOT }}/ndk/22.1.7171670
          JAVA_HOME_OVERRIDE: ${{ env.JAVA_HOME }}
          OPERIT_PROXY_HOST: ""
          OPERIT_PROXY_PORT: ""
        run: |
          cp tools/ffmpeg/build_ffmpeg_kit_wsl.sh /tmp/build.sh
          # strip all proxy lines (CI has direct internet; the hard-coded proxy would break downloads)
          sed -i '/proxy/Id; /PROXY/d; /proxyHost/d; /proxyPort/d' /tmp/build.sh
          # gnutls is the one library that fails to build (fragile nested-submodule
          # bootstrap) and it is only needed for HTTPS/TLS stream I/O. The app's
          # FFmpeg tools do local transcode/probe, so drop gnutls to let the .aar finish.
          sed -i '/--enable-gnutls/d; /^[[:space:]]*gnutls[[:space:]]*$/d' /tmp/build.sh
          chmod +x /tmp/build.sh
          bash /tmp/build.sh "$HOME/build/ffmpeg-kit"
      - name: Locate + stage the .aar
        if: always()
        run: |
          mkdir -p out
          find "$HOME/build/ffmpeg-kit" -name "*.aar" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/ || true
          find "$HOME/build/ffmpeg-kit" -name "*.aar" 2>/dev/null | head
      - name: Upload ffmpeg-kit aar
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ffmpeg-kit-aar, path: out/*.aar, if-no-files-found: warn }
