name: ffmpeg-kit-build
# Build ffmpeg-kit.aar from source on CI (arm64-only), porting tools/ffmpeg/build_ffmpeg_kit_wsl.sh
# faithfully but without the WSL/proxy assumptions -> a REPRODUCIBLE FFmpeg build.
on:
  workflow_dispatch:
  push:
    branches: ["tracendroid/ffmpeg-kit-ci"]
permissions:
  contents: read
jobs:
  build:
    name: ffmpeg-kit android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config cmake ninja-build meson nasm yasm \
            gettext autopoint gperf autogen bison flex texinfo git curl \
            build-essential ragel groff libtasn1-6-dev
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK r25 + cmake
        run: |
          yes | sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1" "platforms;android-33" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
      - name: Clone ffmpeg-kit
        run: git clone --depth 1 --branch v6.0 https://github.com/arthenica/ffmpeg-kit.git "$HOME/ffmpeg-kit"
      - name: Patch for modern distro (from build_ffmpeg_kit_wsl.sh)
        working-directory: /home/runner/ffmpeg-kit
        run: |
          # cpu-features: disable test download
          if [ -f scripts/android/cpu-features.sh ]; then
            sed -i 's~$(android_ndk_cmake) || return 1~$(android_ndk_cmake) -DBUILD_TESTING=OFF || return 1~' scripts/android/cpu-features.sh || true
          fi
          # automake 1.16 name compat
          mkdir -p .tools-compat
          ln -sf "$(command -v aclocal)"  .tools-compat/aclocal-1.16 || true
          ln -sf "$(command -v automake)" .tools-compat/automake-1.16 || true
      - name: Build ffmpeg-kit (arm64 only)
        working-directory: /home/runner/ffmpeg-kit
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          export PATH="$PWD/.tools-compat:$PATH"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export RECONF_libiconv=1 RECONF_gnutls=1
          ./android.sh -f -s --api-level=24 \
            --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64 \
            --enable-fontconfig --enable-freetype --enable-fribidi --enable-gmp --enable-gnutls \
            --enable-lame --enable-libass --enable-libiconv --enable-libtheora --enable-libvorbis \
            --enable-libvpx --enable-libwebp --enable-libxml2 --enable-opencore-amr --enable-shine \
            --enable-speex --enable-dav1d --enable-kvazaar --enable-libilbc --enable-opus \
            --enable-snappy --enable-soxr --enable-twolame --enable-vo-amrwbenc --enable-zimg
      - name: Locate + upload the .aar
        if: always()
        run: |
          find "$HOME/ffmpeg-kit" -name "*.aar" 2>/dev/null | head
          mkdir -p out
          find "$HOME/ffmpeg-kit/prebuilt" -name "*.aar" -exec cp {} out/ \; 2>/dev/null || true
          find "$HOME/ffmpeg-kit" -path "*outputs/aar*" -name "*.aar" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/ || true
      - name: Upload ffmpeg-kit aar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-aar
          path: out/*.aar
          if-no-files-found: warn
